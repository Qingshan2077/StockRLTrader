[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockrl-trader"
version = "0.2.0"
description = "Independent single-asset reinforcement-learning trading experiments"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "gymnasium>=1.0,<2",
  "stable-baselines3>=2.7,<3",
  "torch>=2.3,<3",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1",
       "python-multipart>=0.0.20,<1", "filelock>=3.18,<4"]
market = ["yfinance>=0.2.54,<2"]
legacy = ["streamlit>=1.63,<2", "plotly>=5.24,<7"]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
static = ["ruff>=0.11,<1"]

[project.scripts]
stockrl = "stockrl.cli:main"
stockrl-maintain = "stockrl_app.maintenance:main"
stockrl-worker = "stockrl_app.jobs.worker:main"

[tool.setuptools.packages.find]
include = ["stockrl*", "api*"]

[tool.setuptools.package-data]
api = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["F", "E9"]
