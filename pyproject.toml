[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockrl-trader"
version = "0.1.0"
description = "Independent single-asset reinforcement-learning trading experiments"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "gymnasium>=1.0,<2",
  "stable-baselines3>=2.7,<3",
  "torch>=2.3,<3",
  "streamlit>=1.63,<2",
  "plotly>=5.24,<7",
  "yfinance>=0.2.54,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
stockrl = "stockrl.cli:main"

[tool.setuptools.packages.find]
include = ["stockrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
