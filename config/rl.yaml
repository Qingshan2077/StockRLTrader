# ===========================
# 强化学习参数配置
# ===========================

algorithm: "PPO"                # PPO | SAC

# PPO 参数
ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_arch:
    pi: [128, 64]
    vf: [128, 64]

# SAC 参数
sac:
  learning_rate: 0.0003
  buffer_size: 100000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  ent_coef: "auto"
  policy_arch: [128, 64]

# 训练
training:
  total_timesteps: 100000
  window_size: 10               # RL 观察窗口

# 动作空间
action:
  type: "continuous"            # continuous (execution_ratio)
  low: 0.0
  high: 1.0

# 奖励函数权重
reward:
  pnl_weight: 1.0
  cost_penalty: 0.1
  turnover_penalty: 0.05
  drawdown_penalty: 0.1
  volatility_penalty: 0.05
  drawdown_threshold: 0.02
