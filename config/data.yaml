# ===========================
# 数据源配置
# ===========================

# 市场数据源
market_data:
  provider: "yfinance"          # yfinance | akshare
  cache: true
  cache_format: "csv"           # csv | parquet
  proxy:
    enabled: false
    url: "http://127.0.0.1:7897"

# A 股配置 (provider=akshare 时生效)
ashare:
  adjust: "qfq"                 # qfq=前复权, hfq=后复权, None=不复权
  data_dir: "stock_data/ashare"
  universe_size: 300            # 股票池大小
  min_market_cap: 5e9           # 最低市值（元）
  benchmark: "000300"           # 基准指数（沪深300）

# 美股配置 (provider=yfinance 时生效)
us:
  benchmark: "SPY"

# Benchmark 数据
benchmark:
  auto_download: true

# 数据更新
update:
  auto_update: false
  update_time: "09:30"

# 预加载股票列表 (multi_asset 阶段使用)
universe:
  tech: ["AAPL", "MSFT", "GOOGL", "AMZN", "META"]
  chips: ["NVDA", "AMD", "INTC"]
  china: ["BABA", "JD"]
  custom: []
