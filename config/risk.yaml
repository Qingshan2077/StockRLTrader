# ===========================
# 风控参数配置
# ===========================

position:
  max_gross_exposure: 1.0      # 最大总仓位 (100%)
  max_net_exposure: 1.0        # 最大净仓位
  max_single_asset_weight: 1.0 # 单资产最大权重 (单资产模式下=1.0)

stop_loss:
  enabled: true
  threshold: -0.05              # 固定止损 5%
  reentry_penalty: 0.5          # 重新入场时仓位减半

volatility:
  enabled: true
  target_vol: 0.25              # 目标年化波动率
  vol_window: 20                # 波动率计算窗口
  vol_scaling: true             # 波动率缩放
  vol_threshold: 1.5            # 波动率倍数阈值

drawdown:
  enabled: true
  dynamic_deleverage: true      # 动态降仓
  circuit_breaker: -0.20        # 熔断阈值 (回撤 20%)
  deleverage_factor: 0.5        # 降仓因子 (降到 50%)

liquidity:
  enabled: true
  adv_limit_ratio: 0.01         # 持仓不超过日均成交量的 1%
  minimum_volume: 10000         # 最低成交量过滤

turnover:
  max_daily_turnover: 0.3       # 单日最大换手率 30%

# 行业约束 (多资产预留)
sector:
  enabled: false
  max_sector_exposure: 0.4

# 因子中性 (多资产预留)
factor_neutrality:
  enabled: false
  factors: ["size", "momentum", "volatility"]
